[package]
name = "twapp"
version = "0.4.6"
description = "Terminal wrapper for Claude work sessions"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "twapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.9.1", features = [] }
clap = { version = "4", features = ["derive"] }
tauri-plugin-log = "2"
portable-pty = "0.9"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "process"] }
parking_lot = "0.12"
rand = "0.9"
tauri-plugin-opener = "2"

# CLI dependencies
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
plist = "1"
