name: Test & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin

  release:
    needs: check
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Determine version
        id: bump
        run: |
          BASE_VERSION=$(cat version.txt | tr -d '\n')
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          ./scripts/bump-version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Package release
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          tar -czf twapp-macos-${{ matrix.arch }}.tar.gz twapp.app
          mv twapp-macos-${{ matrix.arch }}.tar.gz $GITHUB_WORKSPACE/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twapp-macos-${{ matrix.arch }}
          path: twapp-macos-${{ matrix.arch }}.tar.gz

  publish:
    needs: release
    runs-on: macos-latest
    # Runs on main can overlap, and an older one can finish last; publishing
    # one at a time lets each see whether a newer release already went out.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: bump
        run: |
          BASE_VERSION=$(cat version.txt | tr -d '\n')
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for a newer release
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null | sed 's/^v//' || true)
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | tail -1)
          if [ -n "$LATEST" ] && [ "$HIGHEST" != "$VERSION" ]; then
            echo "v${LATEST} is newer; v${VERSION} is published but not marked latest or sent to Homebrew"
            echo "newest=false" >> "$GITHUB_OUTPUT"
          else
            echo "newest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            artifacts/twapp-macos-aarch64/twapp-macos-aarch64.tar.gz \
            artifacts/twapp-macos-x86_64/twapp-macos-x86_64.tar.gz \
            --title "v${VERSION}" \
            --generate-notes \
            --latest=${{ steps.newest.outputs.newest }}

      - name: Update Homebrew formula
        if: steps.newest.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_TOKEN secret not set, skipping Homebrew update"
            exit 0
          fi

          VERSION="${{ steps.bump.outputs.version }}"
          SHA256_ARM=$(shasum -a 256 artifacts/twapp-macos-aarch64/twapp-macos-aarch64.tar.gz | awk '{print $1}')
          SHA256_INTEL=$(shasum -a 256 artifacts/twapp-macos-x86_64/twapp-macos-x86_64.tar.gz | awk '{print $1}')

          cat > /tmp/twapp.rb <<RUBY
          class Twapp < Formula
            desc "A structured terminal companion for Claude and Codex coding sessions"
            homepage "https://github.com/piekstra/twapp"
            license "MIT"
            version "${VERSION}"

            depends_on :macos

            on_arm do
              url "https://github.com/piekstra/twapp/releases/download/v${VERSION}/twapp-macos-aarch64.tar.gz"
              sha256 "${SHA256_ARM}"
            end

            on_intel do
              url "https://github.com/piekstra/twapp/releases/download/v${VERSION}/twapp-macos-x86_64.tar.gz"
              sha256 "${SHA256_INTEL}"
            end

            # Homebrew strips single top-level directories from tarballs,
            # so the extracted contents are the inside of twapp.app (Contents/).
            # Reconstruct the app bundle at prefix/twapp.app.
            def install
              (prefix/"twapp.app").install Dir["*"]
              bin.install_symlink prefix/"twapp.app/Contents/MacOS/twapp"
            end

            def caveats
              <<~EOS
                twapp has been installed as a macOS app bundle.

                To avoid repeated macOS permission prompts, create a local code signing certificate:
                  twapp setup-cert
                  twapp install-gui \#{prefix}/twapp.app

                twapp requires at least one supported agent CLI:
                  Claude CLI: https://docs.anthropic.com/en/docs/claude-cli
                  Codex CLI: https://github.com/openai/codex
              EOS
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/twapp --version")
            end
          end
          RUBY

          # Strip leading whitespace from heredoc
          sed -i '' 's/^          //' /tmp/twapp.rb

          # The tap's main takes changes only through a reviewed pull request.
          # One branch per release, cut from main, so the pull request never
          # conflicts, and piekstra-dev is asked to review it. The newest
          # version wins: a run for a version older than the tap's or than an
          # open formula PR's (a publish job that finished late) changes
          # nothing, and a run closes only older formula PRs and deletes only
          # older formula branches, including ones a failed run left behind.
          # Fork PRs are ignored, since `--head` matches on the branch name
          # alone. `gh api` prints a 404's body to stdout, hence `|| VAR=""`
          # outside `$()`.
          TAP=piekstra/homebrew-tap
          FILE=Formula/twapp.rb
          PREFIX=formula/twapp-v
          BRANCH="$PREFIX$VERSION"
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          MAIN_JSON=$(gh api "repos/$TAP/contents/$FILE" 2>/dev/null) || MAIN_JSON=""
          MAIN_BLOB=$(printf '%s' "$MAIN_JSON" | jq -r '.sha // empty' 2>/dev/null) || MAIN_BLOB=""
          MAIN_VERSION=$(printf '%s' "$MAIN_JSON" | jq -r '.content // empty' 2>/dev/null | base64 --decode 2>/dev/null \
            | sed -n 's/^ *version "\(.*\)"$/\1/p' | head -1)
          NEW_BLOB=$(git hash-object /tmp/twapp.rb)
          if [ "$NEW_BLOB" = "$MAIN_BLOB" ]; then
            echo "The tap already has twapp v${VERSION}"
            exit 0
          fi
          if [ -n "$MAIN_VERSION" ] && newer "$MAIN_VERSION" "$VERSION"; then
            echo "::notice title=Homebrew::The tap has twapp v$MAIN_VERSION, newer than v$VERSION; left alone."
            exit 0
          fi
          OPEN=$(gh pr list -R "$TAP" --state open --json number,headRefName,isCrossRepository \
            --jq ".[] | select(.isCrossRepository | not) | select(.headRefName | startswith(\"$PREFIX\")) | \"\(.number) \(.headRefName | ltrimstr(\"$PREFIX\"))\"")
          while read -r N V; do
            if [ -n "$V" ] && newer "$V" "$VERSION"; then
              echo "::notice title=Homebrew::Formula PR #$N carries twapp v$V, newer than v$VERSION; left alone."
              exit 0
            fi
          done <<EOF
          $OPEN
          EOF
          if ! gh api "repos/$TAP/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            MAIN_SHA=$(gh api "repos/$TAP/git/ref/heads/main" --jq .object.sha)
            gh api "repos/$TAP/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$MAIN_SHA" >/dev/null
          fi
          BRANCH_BLOB=$(gh api "repos/$TAP/contents/$FILE?ref=$BRANCH" --jq .sha 2>/dev/null) || BRANCH_BLOB=""
          if [ "$NEW_BLOB" != "$BRANCH_BLOB" ]; then
            CONTENT=$(base64 < /tmp/twapp.rb | tr -d '\n')
            if [ -n "$BRANCH_BLOB" ]; then
              gh api -X PUT "repos/$TAP/contents/$FILE" -f message="twapp ${VERSION}" \
                -f content="$CONTENT" -f branch="$BRANCH" -f sha="$BRANCH_BLOB" >/dev/null
            else
              gh api -X PUT "repos/$TAP/contents/$FILE" -f message="twapp ${VERSION}" \
                -f content="$CONTENT" -f branch="$BRANCH" >/dev/null
            fi
          fi
          PR=$(gh pr list -R "$TAP" --head "$BRANCH" --state open --json url,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].url // empty')
          if [ -z "$PR" ]; then
            PR=$(gh pr create -R "$TAP" --head "$BRANCH" --base main --title "twapp ${VERSION}" \
              --body "Moves the twapp formula to https://github.com/piekstra/twapp/releases/tag/v${VERSION}. Opened by the twapp release workflow; each sha256 is that release's tarball.")
          fi
          gh pr edit "$PR" -R "$TAP" --add-reviewer piekstra-dev >/dev/null 2>&1 \
            || echo "::warning title=Homebrew::Could not request piekstra-dev's review on $PR"
          while read -r N V; do
            if [ -n "$V" ] && [ "$V" != "$VERSION" ]; then
              gh pr close "$N" -R "$TAP" --delete-branch --comment "Superseded by $PR."
            fi
          done <<EOF
          $OPEN
          EOF
          REFS=$(gh api "repos/$TAP/git/matching-refs/heads/$PREFIX" --jq '.[].ref' 2>/dev/null) || REFS=""
          for REF in $REFS; do
            V=${REF#refs/heads/"$PREFIX"}
            if [ "$V" != "$VERSION" ] && newer "$VERSION" "$V"; then
              gh api -X DELETE "repos/$TAP/git/$REF" >/dev/null 2>&1 || true
            fi
          done
          echo "::notice title=Homebrew::$PR moves twapp to v${VERSION}; brew sees it after the piekstra-dev review and merge."
