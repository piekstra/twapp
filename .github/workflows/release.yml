name: Test & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  release:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Determine version
        id: bump
        run: |
          BASE_VERSION=$(cat version.txt | tr -d '\n')
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          ./scripts/bump-version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run tauri build

      - name: Package release
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf twapp-macos-aarch64.tar.gz twapp.app
          mv twapp-macos-aarch64.tar.gz $GITHUB_WORKSPACE/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"
          gh release create "v${{ steps.bump.outputs.version }}" \
            twapp-macos-aarch64.tar.gz \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_TOKEN secret not set, skipping Homebrew update"
            exit 0
          fi

          SHA256=$(shasum -a 256 twapp-macos-aarch64.tar.gz | awk '{print $1}')
          VERSION="${{ steps.bump.outputs.version }}"

          cat > /tmp/twapp.rb <<RUBY
          class Twapp < Formula
            desc "A structured terminal companion for Claude coding sessions"
            homepage "https://github.com/piekstra/twapp"
            url "https://github.com/piekstra/twapp/releases/download/v${VERSION}/twapp-macos-aarch64.tar.gz"
            sha256 "${SHA256}"
            license "MIT"
            version "${VERSION}"

            depends_on :macos
            depends_on arch: :arm64

            def install
              prefix.install "twapp.app"
              bin.install_symlink prefix/"twapp.app/Contents/MacOS/twapp"
            end

            def caveats
              <<~EOS
                twapp has been installed as a macOS app bundle.

                To avoid repeated macOS permission prompts, create a local code signing certificate:
                  twapp setup-cert
                  twapp install-gui \#{prefix}/twapp.app

                twapp requires the Claude CLI: https://docs.anthropic.com/en/docs/claude-cli
              EOS
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/twapp --version")
            end
          end
          RUBY

          # Strip leading whitespace from heredoc
          sed -i '' 's/^          //' /tmp/twapp.rb

          CONTENT=$(base64 -i /tmp/twapp.rb)
          EXISTING_SHA=$(gh api repos/piekstra/homebrew-tap/contents/Formula/twapp.rb --jq '.sha' 2>/dev/null || echo "")

          gh api repos/piekstra/homebrew-tap/contents/Formula/twapp.rb \
            -X PUT \
            -f message="Update twapp to v${VERSION}" \
            -f content="${CONTENT}" \
            -f sha="${EXISTING_SHA}"
