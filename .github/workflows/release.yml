name: Test & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin

  release:
    needs: check
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Determine version
        id: bump
        run: |
          BASE_VERSION=$(cat version.txt | tr -d '\n')
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          ./scripts/bump-version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Package release
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          tar -czf twapp-macos-${{ matrix.arch }}.tar.gz twapp.app
          mv twapp-macos-${{ matrix.arch }}.tar.gz $GITHUB_WORKSPACE/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twapp-macos-${{ matrix.arch }}
          path: twapp-macos-${{ matrix.arch }}.tar.gz

  publish:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: bump
        run: |
          BASE_VERSION=$(cat version.txt | tr -d '\n')
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            artifacts/twapp-macos-aarch64/twapp-macos-aarch64.tar.gz \
            artifacts/twapp-macos-x86_64/twapp-macos-x86_64.tar.gz \
            --title "v${VERSION}" \
            --generate-notes

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_TOKEN secret not set, skipping Homebrew update"
            exit 0
          fi

          VERSION="${{ steps.bump.outputs.version }}"
          SHA256_ARM=$(shasum -a 256 artifacts/twapp-macos-aarch64/twapp-macos-aarch64.tar.gz | awk '{print $1}')
          SHA256_INTEL=$(shasum -a 256 artifacts/twapp-macos-x86_64/twapp-macos-x86_64.tar.gz | awk '{print $1}')

          cat > /tmp/twapp.rb <<RUBY
          class Twapp < Formula
            desc "A structured terminal companion for Claude coding sessions"
            homepage "https://github.com/piekstra/twapp"
            license "MIT"
            version "${VERSION}"

            depends_on :macos

            on_arm do
              url "https://github.com/piekstra/twapp/releases/download/v${VERSION}/twapp-macos-aarch64.tar.gz"
              sha256 "${SHA256_ARM}"
            end

            on_intel do
              url "https://github.com/piekstra/twapp/releases/download/v${VERSION}/twapp-macos-x86_64.tar.gz"
              sha256 "${SHA256_INTEL}"
            end

            def install
              prefix.install "twapp.app"
              bin.install_symlink prefix/"twapp.app/Contents/MacOS/twapp"
            end

            def caveats
              <<~EOS
                twapp has been installed as a macOS app bundle.

                To avoid repeated macOS permission prompts, create a local code signing certificate:
                  twapp setup-cert
                  twapp install-gui \#{prefix}/twapp.app

                twapp requires the Claude CLI: https://docs.anthropic.com/en/docs/claude-cli
              EOS
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/twapp --version")
            end
          end
          RUBY

          # Strip leading whitespace from heredoc
          sed -i '' 's/^          //' /tmp/twapp.rb

          CONTENT=$(base64 -i /tmp/twapp.rb)
          EXISTING_SHA=$(gh api repos/piekstra/homebrew-tap/contents/Formula/twapp.rb --jq '.sha' 2>/dev/null || echo "")

          gh api repos/piekstra/homebrew-tap/contents/Formula/twapp.rb \
            -X PUT \
            -f message="Update twapp to v${VERSION}" \
            -f content="${CONTENT}" \
            -f sha="${EXISTING_SHA}"
